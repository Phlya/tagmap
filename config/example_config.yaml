# Configuration file for the tagmap pipeline.
# Only refgen_path, chrom_sizes_path, cassette_name and the two primer
# sequences are required; everything else has a default in
# workflow/schemas/config.schema.yaml.

# Sample sheets. Give either or both.
# NGS libraries: sample name and paths to the fastq files. Rows with the same
# sample name are merged.
samples_path: 'config/samples.tsv'
# Sanger runs: .ab1 traces or already basecalled fastq, one row per plate/run.
sanger_samples_path: 'config/sanger_samples.tsv'

refgen_path: '../../../mm10_custom.fa'
chrom_sizes_path: '../../../mobilization_mapping/mm10_custom_chromsizes.txt'
# Chromsizes with just the original genome, without the cassette, to use for
# UCSC visualization. Needed when there are NGS samples.
chrom_sizes_path_no_cassette: '../../../genomes/mm10/chromsizes.txt'
# Path to the blacklist file: any peak overlapping this file will be removed
# Simply delete this line if you don't have a blacklist
blacklist: 'resources/blacklist_mm10_PB.bed'

mapper: 'bwa-mem2'

dedup: True

cassette_name: 'mobilized_enhancer'
# Sequence of the primers used to amplify the cassette
# If multiple PCRs were used, use the sequence of the primers used in the last step
# Please only specify the portion of the primers that binds the ITRs
forward_primer_sequence: 'GTACGTCACAATATGATTATCTTTCTAG'
reverse_primer_sequence: 'CGTCAATTTTACGCAGACTATC'
# Sequence of the adapters loaded onto Tn5 transposase, likely Nextera N5 sequence
# Not used at the moment
# adapter_seq: 'TCGTCGGCAGCGTCAGATGTGTATAAGAGACAG'

# Sequence used by the transposon for integration; e.g. TA for SB, TTAA for PB
insertion_seq: "TTAA"


# Peak calling (NGS only)
# Which pairs get used, and how. A fragment runs
#   [tagmentation site] --genome-- [insertion site] --cassette-- [ITR primer]
# so a read long enough to carry on past the junction reports the insertion site
# itself, the same base for every molecule, while a shorter one only gives the
# tagmentation cut - a different random position each time, a median ~130bp off.
#   'coverage'           clusters both kinds together and cuts on read count.
#                        Where reads rarely span the junction that makes one
#                        peak per molecule (30,053 sites for a pool of ~800).
#   'coverage_junctions' throws the shorter ones away first, then thresholds
#                        automatically - exact, but blind to most of the library
#                        and to rare sites.
#   'junction_tiered'    keeps both and uses each for what it is: junctions
#                        place sites and are believed alone, anchored pairs only
#                        corroborate or must clear the thresholds below. Counts
#                        distinct tagmentation positions, so they are captured
#                        molecules rather than PCR. No up-front decision needed.
peak_caller: 'junction_tiered'
# junction_tiered only:
junction_jitter: 2          # junctions this close apart are one site
max_fragment: 1000          # longest fragment an anchored pair may span
min_junction_frags: 1       # one read through the junction is enough
min_junction_mapq: 1        # raise to distrust single reads in repeats
# ...as long as a thinly supported junction also looks like an integration:
# peaks on this many molecules or fewer must carry insertion_seq at the
# junction. Measured on the 2G6 long reads, singleton junctions have a TA only
# 48% of the time against a 23% background, so barely a third are real, while
# 4+ molecule junctions reach 90%. 0 disables the check.
motif_max_support: 3

min_peak_width: 200
min_peak_reads: 10
min_peak_frac: 0.01
# Same-side peak positions this close are merged into one peak. The default
# below suits a genome-wide screen where independent insertions are expected
# to land far apart, so any read scatter near a summit is noise worth
# absorbing. For an assay that intentionally packs many independent
# insertions into one small locus (e.g. mapping where a mobilized
# enhancer/reporter re-integrates within a few Mb of its start), true
# neighbouring sites can sit under 100bp apart - checked here against ~3,500
# manually-curated sites at one such locus, whose nearest-neighbour distance
# has a median of ~740bp and 18% within 100bp of each other. Leaving
# min_peak_dist/max_dist_between_sides at their default there silently
# merges distinct sites and undercounts specifically in the dense region
# (verified: dropped a locus's true site count by ~19% while leaving
# everywhere else nearly unaffected). Turn both down to ~5bp for that kind
# of experiment; the defaults below are for the sparse, genome-wide case.
min_peak_dist: 1000
min_peak_positions: 1
# Peaks from the two sides of the cassette this close are one insertion site
max_dist_between_sides: 100

# Sanger reads
# 'abi-trim' uses the base calls stored in the trace and needs no external
# binary; 'tracy' re-calls the bases from the trace itself
sanger_basecaller: 'abi-trim'
sanger_map_args: '-T 30 -k 19'
# A genomic alignment needs at least this MAPQ and this many aligned bases
sanger_min_mapq: 30
sanger_min_aligned: 30
# A read fails if this many bases before the junction match neither the genome
# nor the construct
sanger_max_unexplained: 50
# Named groups pulled out of each trace file name. Recognised group names are
# well, clone and direction; any others become extra columns in the output.
# Values from the sample sheet fill in whatever this does not capture.
# e.g. matches 'A01_99465_SB_fwd_seq.ab1' -> well=A01, run=99465, direction=fwd
sanger_name_regex: '(?P<well>[A-H]\d{2})_(?P<run>\d+)_.*(?P<direction>fwd|rev)'
sanger_direction_map:
  fwd: forward
  rev: reverse
# Reads of one clone this close together are one integration site
sanger_max_dist: 100

# Where the original, pre-mobilization insertion sits (e.g. an unmobilized
# founder line's cassette locus). A clone whose confirmed Sanger site lands
# here is classified as unmobilized rather than confirmed. Give either of
# these, not both; leave both unset to skip the check.
# original_insertion_site: 'chr11:12345678'
# original_insertion_upstream_seq: 'GATTACAGATTACAGATTACA'
original_insertion_max_dist: 25

# Compare Sanger sites against NGS sites and peaks. Only has an effect when
# both sample sheets are given. Useful when Sanger sequencing only worked from
# one end but the NGS library saw both.
validate_sanger_with_ngs: True
validation_max_dist: 500

# Every individual output path below defaults to living under here, so this
# is usually the only one of the lot worth setting.
results_folder: '../Data/Processed/T1/'
# None of the following are necessary - each is shown commented out with the
# value it already gets from results_folder above. Uncomment one only to
# send that particular file/folder somewhere else, as is done here for
# fastq_folder, to keep the merged-but-untrimmed fastqs with the raw ones
# rather than under Processed.
fastq_folder: '../Data/Raw/T1/fastq/'
# bams_folder: '../Data/Processed/T1/bams'
# pairs_folder: '../Data/Processed/T1/pairs'
# coverage_folder: '../Data/Processed/T1/coverage'
# peaks_folder: '../Data/Processed/T1/peaks'
# insertion_sites_folder: '../Data/Processed/T1/insertion_sites'
# sanger_folder: '../Data/Processed/T1/sanger'
# validation_folder: '../Data/Processed/T1/validation'
# stats_folder: '../Data/Processed/T1/stats'
# primer_position_file: '../Data/Processed/T1/primer_positions.json'
# fasta_index_file: '../Data/Processed/T1/refgen.fai'
