# Sample sheets. Give either or both: NGS libraries are analysed by peak
# calling, Sanger reads one read at a time. Every key not set here falls back to
# the default in workflow/schemas/config.schema.yaml.
samples_path: './config/samples.tsv'
sanger_samples_path: './config/sanger_samples.tsv'

# Reference genome, with the mobilised cassette added as an extra contig
refgen_path: '../refgen/mm10_SB_CTCF.fa'
chrom_sizes_path: '../refgen/mm10_SB_CTCF_chromsizes.txt'
# Chrom sizes of the genome alone, for genome browser output
chrom_sizes_path_no_cassette: '../../../genomes/mm10/chromsizes.txt'

do_fastqc: False

# To enable trimming using fastp, set this to True
trim: False

# Mapper to use: bwa-mem, bwa-mem2 or bwa-meme
# (from slowest to fastest, and from less to more memory needed)
mapper: 'bwa-mem2'

dedup: False

cassette_name: 'SB_cargo_CTCF'
# Sequence of the primers used to amplify the cassette
# If multiple PCRs were used, use the sequence of the primers used in the last step
reverse_primer_sequence: 'aacgagttttaatgactccaactt'
forward_primer_sequence: 'ggtgatcctaactgacctaagac'
# Sequence of the adapters loaded onto Tn5 transposase, likely Nextera N5 sequence
# adapter_seq: 'TCGTCGGCAGCGTCAGATGTGTATAAGAGACAG'

# Sequence used by the transposon for integration; e.g. TA for SB, TTAA for PB
insertion_seq: "TA"

peak_caller: 'coverage'

# Peak calling (NGS only)
min_peak_width: 1
min_peak_reads: 100
min_peak_frac: 0.001
min_peak_dist: 1000
min_peak_positions: 1
max_dist_between_sides: 100

# Sanger reads
# 'abi-trim' uses the base calls stored in the trace, 'tracy' re-calls them
sanger_basecaller: 'abi-trim'
sanger_min_mapq: 30
# Named groups pulled out of each trace file name. Recognised: well, clone,
# direction; anything else is kept as an extra column.
# sanger_name_regex: '(?P<well>[A-H]\d{2})_(?P<run>\d+)'
sanger_max_dist: 100

# Cross-validation of Sanger sites against NGS sites, when both are configured
validate_sanger_with_ngs: True
validation_max_dist: 500

results_folder: '../Data/Processed/T1/'
fastq_folder: '../Data/Raw/T1/fastq/'
