# config_H2_annealing_test.yaml from SB_tagmentation_mapping/tagmap, ported onto the
# current pipeline: paths rebased, sample sheet renamed to the current
# schema, and the peak-calling block replaced by the tiered caller with
# the settings validated against the 2G6 Sanger clones and Mathias
# Eder's CRE6 calls.
#
# The original settings were:
#   {'use_only_read_junctions': False, 'min_peak_width': 50, 'min_peak_reads': 10, 'min_peak_frac': 0.0, 'min_peak_dist': 1000, 'min_peak_positions': None, 'max_dist_between_sides': 1000}
# Those thresholds were tuned for a caller that could not tell a
# sequenced junction from a tagmentation cut, so they are not carried
# over; under junction_tiered they would only ever apply to peaks with
# no junction behind them.

samples_path: ./config/samples_old_H2_annealing_test.tsv
refgen_path: ../SB_tagmentation_mapping/refgen/mm10_SB_CTCF.fa
chrom_sizes_path: ../SB_tagmentation_mapping/refgen/mm10_SB_CTCF_chromsizes.txt
chrom_sizes_path_no_cassette: ../../genomes/mm10/chromsizes.txt
do_fastqc: false
trim: false
mapper: bwa-mem2
dedup: false
cassette_name: SB_cargo_CTCF
forward_primer_sequence: TCCTAACTGACCTAAGACAGG
reverse_primer_sequence: aacgagttttaatgactccaactt
insertion_seq: TA
peak_caller: junction_tiered
junction_jitter: 2
max_fragment: 1000
min_junction_frags: 1
min_junction_mapq: 0
motif_max_support: 3
min_peak_width: 1
min_peak_reads: 2
min_peak_frac: 0.0
min_peak_dist: 500
min_peak_positions: 1
max_dist_between_sides: 2
results_folder: results/old_H2_annealing_test
