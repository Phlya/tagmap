$schema: "https://json-schema.org/draft/2020-12/schema"
description: Configuration for the tagmap workflow
type: object

properties:
  # ---------------------------------------------------------------- inputs --
  samples_path:
    type: string
    description: >
      TSV of paired-end NGS libraries (columns name, fastq1, fastq2, and
      optionally plates). Rows sharing a name are merged. Leave unset for a
      Sanger-only run.
  sanger_samples_path:
    type: string
    description: >
      TSV of Sanger runs (columns name, ab1 or fastq, and optionally
      direction, clone, ngs_sample). Leave unset for an NGS-only run.

  # ------------------------------------------------------------- reference --
  refgen_path:
    type: string
    description: Reference FASTA, including the cassette as an extra contig.
  chrom_sizes_path:
    type: string
    description: Chrom sizes of refgen_path, including the cassette contig.
  chrom_sizes_path_no_cassette:
    type: string
    description: >
      Chrom sizes of the genome alone, without the cassette. Used to trim
      output for genome browsers, which do not know about the cassette.
  mapper:
    type: string
    enum: ["bwa-mem", "bwa-mem2", "bwa-meme", "minibwa"]
    default: "bwa-mem2"
    description: >
      From slowest/leanest to fastest/most memory hungry. minibwa
      (https://github.com/lh3/minibwa) is a newer, faster aligner that isn't
      supported by the bwa-memx wrapper the other three use, so it's mapped
      with its own rules: minibwa mem for the single-end Sanger reads,
      minibwa map --hic for paired-end NGS reads (matching the -SP flags
      used for the other mappers - independent mate mapping, no proper-pair
      assumption, since these are chimeric tagmentation fragments rather
      than conventional inserts).

  # -------------------------------------------------------------- cassette --
  cassette_name:
    type: string
    description: Name of the cassette contig in refgen_path.
  forward_primer_sequence:
    type: string
    description: >
      The part of the forward primer that binds the ITR. If several PCRs were
      used, the primer of the last one. Used for the NGS branch, and as the
      Sanger branch's default unless sanger_forward_primer_sequence is set.
      Required when samples_path is set; a Sanger-only project may instead
      give just sanger_forward_primer_sequence/sanger_reverse_primer_sequence.
  reverse_primer_sequence:
    type: string
    description: As forward_primer_sequence, for the other end of the cassette.
  sanger_forward_primer_sequence:
    type: string
    description: >
      Overrides forward_primer_sequence for the Sanger branch only, for
      projects where the actual Sanger sequencing primer differs from the
      primer used to build the NGS library (e.g. a different primer against
      the same ITR), or where a Sanger-only project has no NGS primer to
      default to at all. Defaults to forward_primer_sequence; required (along
      with sanger_reverse_primer_sequence) when sanger_samples_path is set and
      forward_primer_sequence/reverse_primer_sequence are not given.
  sanger_reverse_primer_sequence:
    type: string
    description: As sanger_forward_primer_sequence, for the reverse primer.
  insertion_seq:
    type: string
    default: "TA"
    description: >
      Motif the transposon integrates into - TA for Sleeping Beauty, TTAA for
      PiggyBac. Sites are snapped onto the nearest occurrence.

  # ----------------------------------------------------------- NGS libraries --
  ngs_mode:
    type: string
    enum: ["pool", "clone"]
    default: "pool"
    description: >
      What an NGS library is. "pool" is a population of cells carrying many
      independent insertions, summarised by the sites found. "clone" is one
      clonal line, expected to carry a single insertion at a few hundred to a
      few thousand reads: the site calling is the same, but each library is
      then also judged on whether one position dominates and nothing else is
      present above background - see ngs_clone_summary.tsv and the clone_*
      settings. Per-sample genome browser tracks are not requested in clone
      mode, since there are too many libraries for them to be useful.
  barcodes_path:
    type: string
    description: >
      TSV (columns plate, side, barcode) of the in-read barcodes that label
      plates, to demultiplex each library in samples_path by - see
      demux_barcodes.py. side is forward or reverse: the ITR the read
      carrying that barcode starts at. A plate may list several barcodes per
      side (e.g. staggered lengths to add diversity to the first bases of the
      library); a read carries any one of them, and they all label the same
      plate. Every library in samples_path is then split into one sample per
      plate, named "{plate}_{name}". Leave unset for libraries that are not
      barcoded.
  barcode_max_mismatch:
    type: integer
    default: 1
    description: >
      Mismatches tolerated when matching a barcode to the start of a read.
      Barcodes are checked at startup to differ from each other by more than
      twice this, so it can never make two of them ambiguous.
  barcode_reads:
    type: string
    enum: ["R1", "R2", "either"]
    default: "R2"
    description: >
      Which read the barcode starts. It is on the read that starts at the ITR
      primer, which is R2 in the usual TagMap layout.
  barcode_require_primer:
    type: boolean
    default: false
    description: >
      Only accept a barcode that is directly followed by the ITR primer of its
      own side (forward_primer_sequence for forward barcodes,
      reverse_primer_sequence for reverse ones). Stricter, and a check on the
      read layout, but wrong if anything sits between barcode and primer.
  barcode_primer_max_mismatch:
    type: integer
    default: 2
    description: Mismatches tolerated in that primer check.
  clone_min_reads:
    type: integer
    default: 20
    description: >
      ngs_mode clone only. A clone with fewer mobilized (junction) read pairs
      than this is called too_few_reads rather than judged on too little.
  clone_min_molecules:
    type: integer
    default: 3
    description: >
      ngs_mode clone only. The dominant site needs at least this many distinct
      molecules (tagmentation positions, not reads - PCR copies do not count)
      behind it, or the clone is called weak.
  clone_max_contamination_frac:
    type: number
    default: 0.02
    description: >
      ngs_mode clone only. Another called site holding at least this fraction
      of the clone's molecules makes it contaminated. Tune on real data - the
      right level depends on how much barcode cross-talk and index hopping the
      run has.
  clone_multi_site_frac:
    type: number
    default: 0.2
    description: >
      ngs_mode clone only. Another site holding at least this fraction means
      the clone really carries more than one insertion (or is a mix of
      clones): multiple rather than contaminated.
  clone_merge_dist:
    type: integer
    default: 0
    description: >
      ngs_mode clone only. A site seen from one ITR side only, within this many
      bases of one seen only from the other, is folded into it as one
      insertion whose two sides were positioned slightly apart, instead of
      counting as two sites. 0 (default) never does; max_dist_between_sides
      already combines sides within a site.
  clone_contaminant_min_molecules:
    type: integer
    default: 2
    description: >
      ngs_mode clone only. A secondary site needs at least this many distinct
      molecules before it counts against the clone at all. At a few dozen
      molecules per clone a single stray molecule already clears a low
      percentage, so clone_max_contamination_frac on its own cannot separate
      real contamination from mismapping or chimeric products - most secondary
      calls at this depth are a single molecule seen from one ITR only.
  clone_contaminant_require_both_sides:
    type: boolean
    default: false
    description: >
      ngs_mode clone only. A secondary site also has to have been seen from
      both ITR primers to count. Strict: one-sided secondary calls are
      overwhelmingly noise, but a genuine second insertion whose other side
      was not captured is then missed too.
  clone_min_dominant_frac:
    type: number
    default: 0
    description: >
      ngs_mode clone only. The dominant site must hold at least this share of
      all the clone's molecules, or the clone is called weak. Unlike
      clone_max_contamination_frac this counts every molecule, including the
      single-molecule scatter that no individual secondary site is judged on,
      so it catches a library that is mostly noise even though nothing
      secondary stands out on its own. 0 (default) disables it.
  clone_require_both_sides:
    type: boolean
    default: false
    description: >
      ngs_mode clone only. Call a clone weak unless its dominant site was seen
      from both ITR primers, rather than accepting one side alone.

  # ---------------------------------------------------------- NGS analysis --
  do_fastqc:
    type: boolean
    default: false
  trim:
    type: boolean
    default: false
    description: Trim reads with fastp before mapping.
  trim_args:
    type: string
    default: ""
    description: Extra arguments passed to fastp when trim is true.
  dedup:
    type: boolean
    default: true
  blacklist:
    type: string
    description: Peaks overlapping this BED are dropped. Unset to disable.
  min_reads_per_molecule:
    type: integer
    default: 0
    description: >
      Drop molecules that fewer than this many reads support, counting the
      retained read and the PCR duplicates marked against it. In an
      over-amplified library a real fragment is copied many times, so a
      molecule seen exactly once saw no amplification at all.

      Measured on a real per-clone run it separates signal from scatter better
      than any downstream threshold: molecules at a clone's dominant insertion
      site had a median of 5 reads and 34% were single-read, against a median
      of 1 read and 73% single-read elsewhere. At a cut of 3 reads, 57% of the
      dominant site's molecules survived against 14% of the rest.

      It is a trade: roughly half the real signal goes too, so a genuinely rare
      insertion captured once is lost, and the molecule counts every other
      threshold is judged on roughly halve - thresholds calibrated without it
      need lowering to match. 0 (the default) disables it.

      Requires dedup: true, since the marked duplicates are what the count
      comes from.

  # --------------------------------------------------------- peak calling ---
  peak_caller:
    type: string
    enum: ["coverage", "coverage_junctions", "junction_tiered"]
    default: "junction_tiered"
    description: >
      Which pairs are used, and how, in one setting.

      A TagMap fragment runs [tagmentation site] --genome-- [insertion site]
      --cassette-- [ITR primer]. When a read is long enough to carry on past the
      junction, the first genomic base it reaches is the insertion site itself,
      the same base for every molecule. When it is not, the only genomic
      coordinate in the pair comes from the other read, which starts at the
      tagmentation cut - a different random position per molecule.

      "coverage" clusters those genomic coordinates and cuts on read count,
      without distinguishing the two. Where reads rarely span the junction that
      makes one peak per molecule: on the 2G6 MiSeq run, 30,053 sites for a pool
      of ~800.

      "coverage_junctions" first throws away every pair that did not read
      through, then does the same clustering with an automatic intensity
      threshold. Positions are exact, but everything the shorter reads saw is
      gone, and the threshold drops rare sites.

      "junction_tiered" keeps both kinds and uses each for what it is: junctions
      place a site to the base and are believed on their own, ITR-anchored pairs
      may only corroborate one, or form a peak that must still clear
      min_peak_reads/min_peak_frac. It also counts distinct tagmentation
      positions rather than reads, so abundance is captured molecules instead of
      PCR. It is the default, and needs no up-front decision about read length.
  junction_jitter:
    type: integer
    default: 2
    description: >
      junction_tiered only. Junction positions this close apart are one site,
      absorbing mapping wobble. Keep it small: in a local re-mobilisation
      assay, distinct real insertions can sit only 1-2bp apart and still show
      cleanly opposite orientations read-for-read - set to 0 to trust every
      distinct junction base as its own site (still subject to
      max_dist_between_sides for combining a site's forward/reverse peaks).
  max_fragment:
    type: integer
    default: 1000
    description: >
      junction_tiered only. Longest junction-to-tagmentation distance a pair
      may span, i.e. the largest library fragment. Bounds how far an
      ITR-anchored pair may reach to corroborate a junction.
  min_junction_frags:
    type: integer
    default: 1
    description: >
      junction_tiered only. Distinct tagmentation positions among
      junction-spanning reads needed to call a site. The default of 1 is the
      point of the tiering - one read that spelled out the junction is proof of
      an integration, however rare it is in the pool.
  min_junction_mapq:
    type: integer
    default: 0
    description: >
      junction_tiered only. Junction pairs below this MAPQ are dropped rather
      than trusted on their own. Worth raising above 0 if single-read sites in
      repeats are a concern.
  motif_max_support:
    type: integer
    default: 0
    description: >
      junction_tiered only. Junction peaks supported by this many distinct
      molecules or fewer must also carry insertion_seq at the junction, which is
      what a genuine integration looks like. 0 disables the check. It is what
      makes min_junction_frags: 1 safe: on the 2G6 long-read library a singleton
      junction carries a TA only 48% of the time against a 23% background - so
      barely a third can be real - while junctions seen on four or more
      molecules reach 90%. Asking thin peaks to look like integrations keeps the
      genuinely rare ones without the chimeras, and calibrates itself, since the
      motif rate against background is a false-discovery estimate needing no
      labelled sites.
  min_peak_width:
    type: integer
    default: 1
  min_peak_reads:
    type: integer
    default: 10
  min_peak_frac:
    type: number
    default: 0.01
  min_peak_dist:
    type: integer
    default: 1000
    description: >
      Same-side peak positions within this distance are merged into one peak.
      Suited to a genome-wide screen, where independent insertions land far
      apart and anything closer is read scatter around one true site. Turn
      this down (e.g. to ~5) for an assay that packs many independent
      insertions into one small locus (e.g. local re-mobilization of a
      cassette), where true neighbouring sites can be under 100bp apart -
      left at the default, such sites get silently merged and undercounted.
  min_peak_positions:
    type: integer
    default: 1
  snap_window:
    type: integer
    default: 5
    description: >
      Before forward/reverse peaks are combined, each one is snapped to the
      nearest insertion_seq motif within this many bases, so both sides of
      one real integration land on the exact same base regardless of a few
      bp of slop (the +/- strand pos5 reporting offset, indel wobble,
      Sleeping Beauty's own target-site duplication) - checked against real
      data, a peak's own raw position can be off by up to ~4bp even when
      correct. This is what lets max_dist_between_sides below be set tight:
      with snapping on, two peaks from one real integration should already
      share a position, so a small max_dist is only covering the cases
      snapping itself could not resolve (no motif within window). 0 disables
      snapping.
  max_dist_between_sides:
    type: integer
    default: 100
    description: >
      Peaks from the forward and reverse side of the cassette within this
      distance are combined into one insertion site. With snap_window
      enabled (the default), this only needs to be small - e.g. 2 - since
      real pairs should already coincide; it still governs the genome-wide-
      vs-dense-locus tradeoff (see min_peak_dist) for whatever snapping
      could not resolve.
  min_orientation_support:
    type: integer
    default: 20
    description: >
      A peak needs at least this many distinct molecules before it gets a
      say in which way its site faces. Checked against Sanger-confirmed
      sites: peaks under ~20 molecules were barely better than a coin flip
      on strand, while every peak above ~100 molecules was correct. Raise
      it to demand more evidence before committing to a strand (more sites
      fall back to "."); 0 disables the check and trusts every peak's own
      orientation, however thin.

  min_orientation_support_confirmed:
    type: integer
    default: 1
    description: >
      Like min_orientation_support, but only counting peaks that are
      themselves junction-tier (find_peaks_junctions.py's own evidence
      files - only the junction_tiered peak caller writes these). A
      junction-tier peak already cleared its own evidence bar on the way in
      - a directly sequenced junction, plus a TA-motif check for one only
      thinly supported (motif_max_support) - so trusting its stated
      orientation on far less pooled support than an ordinary peak is a
      deliberate, calibrated choice, not a lowered bar across the board:
      an orientation is trusted once it clears *either* this threshold on
      junction-tier support alone, or min_orientation_support on every peak
      pooled together. 0 disables this, falling back to
      min_orientation_support for every peak regardless of tier. Has no
      effect for a peak caller other than junction_tiered.

  # ------------------------------------------------------- Sanger analysis --
  sanger_basecaller:
    type: string
    enum: ["abi-trim", "tracy"]
    default: "abi-trim"
    description: >
      abi-trim reads the base calls embedded in the .ab1 trace and applies Mott
      trimming; tracy re-calls bases from the trace itself.
  sanger_map_args:
    type: string
    default: "-T 30 -k 19"
    description: Extra arguments for mapping Sanger reads.
  sanger_min_mapq:
    type: integer
    default: 30
    description: Minimum MAPQ for a genomic alignment to define a site.
  sanger_min_aligned:
    type: integer
    default: 30
    description: Minimum aligned length of the genomic segment of a read.
  sanger_max_unexplained:
    type: integer
    default: 50
    description: >
      A read fails QC if more than this many bases before the genomic segment
      are neither aligned to the genome nor to the cassette.
  sanger_max_deletion_size:
    type: integer
    default: 2000
    description: >
      A read's genomic segments after the one nearest the primer do not fail
      it as an ambiguous multi-site read when each is colinear with the one
      before it - same chromosome, same strand - and separated from it by a
      deletion no larger than this. bwa reports a deletion too large for a
      single CIGAR 'D' as a separate supplementary alignment instead, which
      this is meant to tell apart from a genuinely unrelated second
      alignment.
  sanger_name_regex:
    type: ["string", "null"]
    default: null
    description: >
      Regex with named groups matched against each .ab1/read file stem, e.g.
      '(?P<well>[A-H]\d{2})_(?P<run>\d+)'. Recognised groups are well, clone
      and direction; any others are carried through as extra columns. Values
      from the sample sheet fill in whatever the regex does not capture.
  sanger_direction_map:
    type: object
    default:
      F: forward
      R: reverse
    description: >
      Maps the value of the regex's direction group onto forward/reverse.
      Reads sequenced with the reverse primer have their strand flipped, so
      that the strand always describes the cassette's orientation.
  sanger_default_direction:
    type: string
    enum: ["forward", "reverse"]
    default: "forward"
    description: Used when neither the regex nor the sample sheet give one.
  sanger_max_dist:
    type: integer
    default: 100
    description: Reads within this distance are collapsed into one site.
  original_insertion_site:
    type: string
    description: >
      chrom:pos (0-based) of the original, pre-mobilization insertion - e.g.
      an unmobilized founder line's cassette locus. A clone whose confirmed
      Sanger site falls within original_insertion_max_dist of this position
      is classified as unmobilized rather than confirmed, since it never left
      its starting locus. Give this or original_insertion_upstream_seq, not
      both; leave both unset to skip the check.
  original_insertion_upstream_seq:
    type: string
    description: >
      Alternative to original_insertion_site: genome sequence immediately
      upstream of the original insertion, as it reads on the reference's
      forward strand. Must occur exactly once outside the cassette contig;
      the workflow locates it once and uses the position right after the
      match as the original insertion site.
  original_insertion_max_dist:
    type: integer
    default: 25
    description: >
      Distance within which a Sanger site counts as being at the original
      insertion (see original_insertion_site/original_insertion_upstream_seq).
  validated_clones_region:
    type: string
    description: >
      chrom:start-end (0-based, half-open) - restricts
      confirmed_sanger_sites_region.bed to fully validated clones landing in
      this region, e.g. to pull out clones near a known hotspot. Leave unset
      to include fully validated clones anywhere there. Also drawn onto
      report.pdf's Sanger clones table: a validated clone landing in this
      region gets a bold border around its row, on top of its usual
      green/yellow/red fill.

  # ------------------------------------------------------------ validation --
  validate_sanger_with_ngs:
    type: boolean
    default: true
    description: >
      Compare Sanger sites against NGS sites and peaks. Only has an effect when
      both sample sheets are given.
  validation_max_dist:
    type: integer
    default: 500
    description: Distance within which a Sanger and an NGS site are the same site.
  validation_ambiguity_dist:
    type: integer
    default: 50
    description: >
      A Sanger read can land a few bp closer to a neighbouring NGS site than
      to the one it really belongs to. If several NGS sites lie within this
      distance of a Sanger site and they do not all show the same orientation
      and the same sides (forward/reverse), the Sanger site cannot be tied to
      one of them and its ngs_verification is "ambiguous" - NGS is then not
      used to complete a side Sanger left unconfirmed. Set to 0 to only
      consider NGS sites overlapping the Sanger site.

  # --------------------------------------------------------------- outputs --
  results_folder:
    type: string
    default: "results"
    description: >
      Base folder for every output below that is not given its own path.
      Usually the only one of the output settings worth setting - give this
      one path and get a self-contained, namespaced results tree; the rest
      only need overriding if you want a particular file somewhere else.
  fastq_folder:
    type: string
    description: Defaults to "{results_folder}/fastq".
  bams_folder:
    type: string
    description: Defaults to "{results_folder}/bams".
  pairs_folder:
    type: string
    description: Defaults to "{results_folder}/pairs".
  coverage_folder:
    type: string
    description: Defaults to "{results_folder}/coverage".
  peaks_folder:
    type: string
    description: Defaults to "{results_folder}/peaks".
  insertion_sites_folder:
    type: string
    description: Defaults to "{results_folder}/insertion_sites".
  sanger_folder:
    type: string
    description: Defaults to "{results_folder}/sanger".
  validation_folder:
    type: string
    description: Defaults to "{results_folder}/validation".
  stats_folder:
    type: string
    description: >
      Summary tables (mobilization rate, site sidedness, Sanger QC, per-clone
      coverage, cross-validation) and the combined report.md. Defaults to
      "{results_folder}/stats".
  primer_position_file:
    type: string
    description: Defaults to "{results_folder}/primer_positions.json".
  sanger_primer_position_file:
    type: string
    description: >
      Like primer_position_file, but built from
      sanger_forward_primer_sequence/sanger_reverse_primer_sequence for the
      Sanger branch. Defaults to "{results_folder}/sanger_primer_positions.json".
  original_site_file:
    type: string
    description: >
      Resolved chrom/pos of the original insertion (see
      original_insertion_site/original_insertion_upstream_seq). Only written
      when one of those is set. Defaults to "{results_folder}/original_site.json".
  fasta_index_file:
    type: string
    description: >
      samtools/pysam .fai index of refgen_path, used to look up sequence at
      insertion sites. Kept here rather than next to the FASTA so that a
      shared, read only reference genome still works. Defaults to
      "{results_folder}/refgen.fai".

required:
  - refgen_path
  - chrom_sizes_path
  - cassette_name
