$schema: "https://json-schema.org/draft/2020-12/schema"
description: One paired-end NGS library. Rows sharing a name are merged.
type: object

properties:
  name:
    type: string
    description: Sample name. Repeat it across rows to merge several fastq pairs.
  fastq1:
    type: string
    description: Path to the R1 fastq(.gz).
  fastq2:
    type: string
    description: Path to the R2 fastq(.gz).

  plates:
    type: string
    description: >
      Only with barcodes_path: comma-separated plates (as named in the barcode
      sheet) expected in this library. Defaults to every plate in the sheet;
      listing fewer avoids processing plates known to be absent.

required:
  - name
  - fastq1
  - fastq2
