name: tagmap
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.9
  - pairtools >=1.0
  - bioframe >=0.4
  - pandas >=1.5
  - numpy
  - pybbi
  - ucsc-bedgraphtobigwig
  - pyfastx >=1.0
  - scikit-image >=0.19
  - biopython >=1.80
  - pysam >=0.21
  - pyyaml
  - coreutils
  # Only needed when sanger_basecaller is 'tracy'; harmless otherwise.
  - tracy >=0.7
  - chromsize >=0.0.34
  - minibwa